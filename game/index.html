<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOAMDEEP — Delve the Nine Vaults</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 8px; top: 8px; color: #7fe08a; font: 12px monospace; white-space: pre; z-index: 5; }
</style>
</head>
<body>
<canvas id="game" aria-label="GLOAMDEEP: a roguelite dungeon crawler. Pick a hero, descend nine vaults, loot, level up, and slay the Hollow King."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="selftest"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
